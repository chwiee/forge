# Namespace for the build pods + the vulnerability DB mirror (forge db serve).
apiVersion: v1
kind: Namespace
metadata:
  name: forge-ci
  labels:
    # The build pods need seccomp Unconfined to create their nested user namespace.
    # The real isolation is hostUsers: false (root in the pod = unprivileged uid on the node).
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-builder      # bound to the ECR push role by an EKS Pod Identity association
  namespace: forge-ci
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-db
  namespace: forge-ci
  labels: {app: forge-db}
spec:
  replicas: 1
  selector:
    matchLabels: {app: forge-db}
  template:
    metadata:
      labels: {app: forge-db}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: forge-db
          image: __FORGE_IMAGE__
          args: ["db", "serve", "--dir", "/data/grype", "--addr", ":8080", "--sync-every", "24h"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-db
  namespace: forge-ci
spec:
  selector: {app: forge-db}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Where the approved image runs on both architectures from ONE tag.
apiVersion: v1
kind: Namespace
metadata:
  name: forge-lab-apps
  labels:
    pod-security.kubernetes.io/enforce: restricted
